name: grade-ledger

# Weekly MOV-HOLD-2 grading: freeze closes for started events, compute realized
# CLV vs Pinnacle close (primary) and retail consensus close, update the
# dashboard. Settlement W/L merges from movement/results/results.csv when filled.
on:
  schedule:
    - cron: "0 12 * * 1"        # Mondays 12:00 UTC (after weekend cards)
  workflow_dispatch: {}

concurrency:
  group: poll-odds              # share the lock with the poller: same-branch commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Grade and publish dashboard
        run: |
          git config user.name  "odds-capture-bot"
          git config user.email "actions@github.com"
          python movement/grade_ledger.py
          git add movement/ledger movement/reference movement/DASHBOARD.md
          if ! git diff --cached --quiet; then
            git commit -m "movement: grade $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for a in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push attempt $a failed, retrying"; sleep 5
            done
          fi
