name: poll-odds

# GitHub throttles cron hard (we measured ~13 fired runs/day on "*/20").
# Fix: request HOURLY runs, and each run polls in an INTERNAL LOOP —
# 5 polls ~10 minutes apart, committing after each. Effective data cadence
# ~10 min whenever a run fires, even if the scheduler skips slots.
# Each row carries its own poll_time, so irregular cadence never corrupts data.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}          # allow manual runs from the Actions tab

# Never let two polls race on the same branch.
concurrency:
  group: poll-odds
  cancel-in-progress: false

permissions:
  contents: write                # required to commit the captured data back
  issues: write                  # movement scorer opens one issue per new signal

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      # v5/v6 run natively on Node 24. The older v4/v5 pair still works but
      # GitHub force-runs them on Node 24 and warns; pinning here removes the
      # warning and avoids a break when the compatibility shim is withdrawn.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 5 polls per run, ~10 min apart, committing after each so data lands
      # even if a later iteration (or the whole runner) dies mid-run.
      - name: Poll loop
        run: |
          git config user.name  "odds-capture-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            echo "=== poll $i of 5 ==="
            python poll_bfo.py --out-dir data || echo "BFO_FAILED=1" >> "$GITHUB_ENV"
            python poll_pinnacle.py --out-dir data || echo "PIN_FAILED=1" >> "$GITHUB_ENV"
            git add data
            if ! git diff --cached --quiet; then
              git commit -m "odds: poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              OK=0
              for a in 1 2 3; do
                git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
                git push origin "HEAD:${GITHUB_REF_NAME}" && OK=1 && break
                echo "push attempt $a failed, retrying"; sleep 5
              done
              # a silently-lost push means lost data — surface it (V3 P1)
              [ "$OK" -ne 1 ] && echo "PUSH_FAIL=1" >> "$GITHUB_ENV"
            else
              echo "no new rows on poll $i"
            fi
            [ "$i" -lt 5 ] && sleep 600
          done
          [ -z "$PUSH_FAIL" ] || { echo "::error::a poll commit failed to push"; exit 1; }

      # MOV-HOLD-2 scorer: runs on the data just committed. Fail-soft — a scorer
      # problem must never take down the capture job (data > signals).
      - name: Score movement signals
        run: |
          python movement/score_signals.py || { echo "SCORE_FAILED=1" >> "$GITHUB_ENV"; exit 0; }
          git add movement/state movement/ledger
          if ! git diff --cached --quiet; then
            git commit -m "movement: signals $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for a in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push attempt $a failed, retrying"; sleep 5
            done
          fi

      - name: Open issues for new signals
        if: env.SCORE_FAILED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess, pathlib
          p = pathlib.Path("movement/state/new_alerts.json")
          alerts = json.loads(p.read_text()) if p.exists() else []
          for a in alerts:
              act = "ACTIONABLE NOW" if a["actionable_now"] else "WATCH (price below minimum)"
              title = f"[{a['tier']}] {a['selected_fighter']} ({a['selected_side']}) at {a['min_acceptable_amer']} or better — {act}"
              body = "\n".join([
                  f"**Event start:** {a['event_start']}",
                  f"**Bet:** {a['selected_fighter']} ({a['selected_side']}, tier {a['tier']})",
                  f"**Minimum acceptable price:** {a['min_acceptable_amer']} ({a['min_acceptable_dec']} decimal) — anything worse: PASS",
                  f"**Best captured price:** {a['best_amer']} at {a['best_book']} ({a['best_dec']} decimal)",
                  f"**Model:** p={a['p_market']}, EV at entry {a['ev_entry']:+.1%}, steam {a['steam_prob']:.0%}, predicted CLV {a['pred_clv_pp']:+.2f}pp",
                  f"**Projected close:** fair {a.get('pred_fair_close_amer','?')} / board ~{a.get('est_board_close_amer','?')} (display only, not a selection input)",
                  (f"**Paper stake:** ${a.get('stake_usd', 0):.2f} ({a['stake_fraction']:.2%} of paper bankroll)"
                   if a['tier'] == 'A' else
                   f"**Paper stake:** ${a.get('stake_usd', 0):.2f} flat (B-tier, paper only)"),
                  "", "Rules: bet at the minimum price or better at any book; no chasing, no rebets. See movement/PREREG.md.",
              ])
              subprocess.run(["gh", "issue", "create", "--title", title, "--body", body],
                             check=False)
          PY

      - name: Flag scraper failures
        if: env.BFO_FAILED || env.PIN_FAILED
        run: |
          {
            echo "### Scraper problems this run"
            [ -n "$BFO_FAILED" ] && echo "- **BFO poll failed at least once** — layout may have changed"
            [ -n "$PIN_FAILED" ] && echo "- Pinnacle poll failed at least once"
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail the run only if the PRIMARY source broke.
          [ -z "$BFO_FAILED" ]
