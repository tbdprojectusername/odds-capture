name: poll-odds

# Every 20 minutes. GitHub's scheduler is best-effort and can lag under load,
# which is fine — each row carries its own poll_time, so an irregular cadence
# just means irregular sampling, never wrong timestamps.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}          # allow manual runs from the Actions tab

# Never let two polls race on the same branch.
concurrency:
  group: poll-odds
  cancel-in-progress: false

permissions:
  contents: write                # required to commit the captured data back

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v5/v6 run natively on Node 24. The older v4/v5 pair still works but
      # GitHub force-runs them on Node 24 and warns; pinning here removes the
      # warning and avoids a break when the compatibility shim is withdrawn.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Sources are independent: if one book's site changes shape, the other
      # must still record. `|| true` keeps a single failure from losing the poll,
      # and the step summary flags it.
      - name: Poll BestFightOdds (primary)
        id: bfo
        run: python poll_bfo.py --out-dir data || echo "BFO_FAILED=1" >> "$GITHUB_ENV"

      - name: Poll Pinnacle (secondary)
        id: pin
        run: python poll_pinnacle.py --out-dir data || echo "PIN_FAILED=1" >> "$GITHUB_ENV"

      - name: Commit new quotes
        run: |
          git config user.name  "odds-capture-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no new rows this poll"
            exit 0
          fi
          git commit -m "odds: poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Another poll may have landed while we ran; rebase then push.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push attempt $i failed, retrying"; sleep 5
          done

      - name: Flag scraper failures
        if: env.BFO_FAILED || env.PIN_FAILED
        run: |
          {
            echo "### Scraper problems this poll"
            [ -n "$BFO_FAILED" ] && echo "- **BFO poll failed** — layout may have changed"
            [ -n "$PIN_FAILED" ] && echo "- Pinnacle poll failed"
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail the run only if the PRIMARY source broke.
          [ -z "$BFO_FAILED" ]
